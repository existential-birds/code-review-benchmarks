# The loop's settings, from the assumed defaults of
# https://github.com/existential-birds/code-review-benchmarks/issues/42.
# Change any of them here; a run may override a value for itself.

# Benchmark scored every iteration: small catalogs and a round report; AACR's dev catalog is about 33 GB.
climb_benchmark = "reviewbench"
# Rests on matches with reference findings, not on the judge's opinion of unmatched ones.
primary_metric = "grounded_f1"
# #45 measured noise on these 50: 25 would need a gain of 0.037 to show at five rounds, 50 one of 0.0205.
climb_set_size = 50
# The same size as the climb set, so the same noise figures apply; change the two together.
check_set_size = 50
# About the recall gain accepted for committed review in existential-birds/daydream#1686.
target_gain = 0.02
# An unchanged build passes one comparison about 1 time in 40; the check set and confirmation catch most of those.
accept_z = 2.0
# Caps an iteration at 250 climb trials.
rounds_max = 5
# A rejected change usually shows it in the first round.
futility_stop = true
# Committed review was accepted at +14% cost and +19% time; more than that needs a person.
max_cost_ratio = 1.25
# A tripwire for flooding; the precision guards do the real work.
max_findings_ratio = 2.0
# Above these Daydream requires a simplification sweep, and a small diff is easier to attribute.
max_diff_files = 5
max_diff_lines = 500
# Daydream's gate budget is 2 minutes on a cloud container; 300 seconds leaves headroom for a slower machine.
gate_timeout_seconds = 300
# Tests of the pinned build that fail on macOS before any change, so no candidate could pass the gate
# there. Daydream's CI runs on Linux only, where they pass. Checked at f18f4f0 for #53: this one counts one
# "could not be cleaned" warning of the two it expects on macOS and passes on Linux. Deselected on macOS only.
gate_deselect_macos = [
    "tests/test_artifact_visibility.py::test_closing_session_bounds_finished_runs_and_drops_finalized_live_copies",
]
# The documented -n; recorded runs used 2 or 3.
concurrency = 2
# Harbor's -r for every round. Daydream 84c37cd's Pi backend gives up on a review when OpenRouter
# drops a connection ("other side closed"), about 1 request in 80, which ends about a third of
# reviews; one retry re-runs such a trial as a fresh review. Back to 0 once Daydream retries it.
trial_retries = 1
# A full iteration: five climb and five check rounds of 50, at the 2 to 4 hours and about $126 a round
# that #45 measured, with room for the proposer, gate and canary.
iteration_max_wall_hours = 48
# The same, with headroom.
iteration_max_cost_usd_equiv = 1500
# One run is a few days, short enough to review.
run_max_iterations = 10
# About ten climb-only iterations of five rounds; at 10 to 20 hours each, run_max_wall_hours
# usually ends a run first.
run_max_cost_usd_equiv = 6500
# Five days.
run_max_wall_hours = 120
# Half a run without a kept change.
plateau_iterations = 5
# No stacking on an unreviewed change.
max_unmerged_winners = 1
# A winner opens a draft pull request for human review; nothing merges without a person.
auto_open_pr = true
# The convention of existential-birds/daydream#1672.
holdout_rounds = 3
# Not worse than baseline beyond noise, and a gain on ReviewBench's test set: 25 and 54 cases can't prove a 0.02 gain alone.
holdout_rule = "no-worse-and-reviewbench-test-gain"
# Keeps what the loop learns about held-out to a few bits.
holdout_max_uses = 10
# Judge-only trials are cheap.
canary_cases = 10
canary_every = 5
# Limits drift between baseline and candidate rounds.
baseline_max_age_days = 14
# Enough to debug a recent rejection.
keep_rejected_jobs = 3
# Below this the two builds were scored on too few common cases to compare.
min_matched_fraction = 0.8
# A proposer that repeats itself three times has nothing new.
max_proposal_attempts = 3
# Three iterations lost to builds, jobs or logins means something is broken.
invalid_streak_stop = 3
# One wait for a subscription limit to clear, then stop.
limit_backoff_minutes = 60
# A dev round is 131 cases and about 8 reviewer-hours; AACR is used at confirmation.
aacr_in_climb = false

# The three model roles (#81). Each is a slot: change a field to swap the harness, provider,
# model or effort. effort = "default" sends none, so the provider's or harness's own applies.
# Scores, noise figures and ledgers record the reviewer and judge slots, and the loop compares
# only scores made under the same two; the proposer may change freely.

# Who reviews: Daydream's Pi backend through OpenRouter, with DeepSeek V4.1 Flash on every phase
# (Daydream has no per-phase model table on Pi). The model is always passed: without one,
# Daydream falls back to its own DEFAULT_PI_MODEL. The key comes from OPENROUTER_API_KEY.
# Daydream's defaults on Codex, the reviewer before #81, are backend "codex", provider "openai",
# model and effort "default".
[reviewer]
harness = "daydream"
backend = "pi"
provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash-1017"
effort = "default"

# Who judges: Pi on the ChatGPT subscription login, with the provider's default reasoning, as
# docs/citing.md describes. Changing it restarts every baseline.
[judge]
harness = "pi"
provider = "openai"
model = "gpt-6.1-sol"
effort = "default"

# Who proposes, in loop.propose's container, which holds only a copy of the baseline, the
# evidence pack and this CLI's login: the container is the sandbox. agy 1.5.16 has a Linux arm64
# build, but its login lives in the macOS Keychain and doesn't reach the container, so Codex runs
# until an agy login folder exists (AGY_LOGIN_DIR; loop/proposers.py says how to make one).
# agy: cli "agy", model "gemini-4-neon-xhigh", effort "xhigh".
[proposer]
cli = "codex"
model = "gpt-6.2-sol"
effort = "high"

# Derived by the noise measurement of #45 (docs/loop-noise.md, loop/noise.json): five rounds of
# Daydream 0.37.0 on the 50 climb cases. accept_threshold(R) = accept_z * sigma * sqrt(2 / R)
# follows from sigma. Even at rounds_max the threshold, 0.0205, sits just above target_gain:
# the loop detects a grounded F1 gain of 0.0205 or more, and the 25-case set reaches only 0.037.
[derived]
# The one-sided 80% upper bound of the SD of pooled grounded F1 between rounds.
sigma = 0.01620729443009426
# No R up to rounds_max reaches target_gain, so the most the loop allows.
rounds = 5
# accept_z times the upper-bound SD of a difference of two 5-round means, for the wider of the
# two pooled precisions; for unmatched findings judged wrong per scored case; and for unfinished
# reviews per round. The last two are rare counts, so their SD is never taken below Poisson's.
precision_margin = 0.024083429458845364
wrong_findings_margin = 0.026352313834736494
incomplete_margin = 1.788854381999832
# The slots #45 measured: Daydream's defaults on Codex, judged by gpt-6.1-sol. They aren't the
# configured reviewer, so these values are refused until #82 measures the noise again.
judge = "openai/gpt-6.1-sol"

[derived.reviewer]
harness = "daydream"
backend = "codex"
provider = "openai"
model = "default"
effort = "default"
