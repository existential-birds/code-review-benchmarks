schema_version = "1.3"

[task]
name = "aacr/laravel-framework-56591"
description = "One pinned AACR review case with a fixed Oracle reviewer and subscription judge."
authors = []
keywords = ["code-review", "aacr", "oracle"]

[agent]
timeout_sec = 60.0

[environment]
