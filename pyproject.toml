[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-benchmarks"
version = "0.1.0"
description = "Harbor-based evaluation suite for code review agents"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typing-extensions==4.16.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["benchmarks*"]

[tool.setuptools.package-data]
"benchmarks.aacr" = ["templates/**/*"]
"benchmarks.daydream" = ["build.json"]
"benchmarks.pi" = ["*.mjs", "package*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
