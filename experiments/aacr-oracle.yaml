# Scores the Laravel oracle task, to check the judge without running Daydream.
job_name: aacr-oracle
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
agents:
  - name: oracle
verifier:
  import_path: benchmarks.pi.verifier:PiJudgeVerifier
environment:
  type: docker
  delete: true
tasks:
  - path: artifacts/aacr/tasks/laravel-framework-56591
