# Shared ReviewBench settings; give the catalog with -p.
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
agents:
  - import_path: benchmarks.daydream.agent:DaydreamAgent
    # ReviewBench's tasks allow 15 minutes; a complete Daydream review needs more.
    override_timeout_sec: 5400
    kwargs:
      capture_data: true
    # A Pi reviewer's provider key, read from where harbor run starts. Harbor sets it on the agent
    # phase's commands only and saves the job's configuration with ${OPENROUTER_API_KEY} in its
    # place, never the value. Unset, it is empty, which a Codex reviewer ignores.
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
verifier:
  # Within the judge login's validity below; across 105 recorded trials, Daydream reviews
  # included, a verification took at most ten minutes.
  override_timeout_sec: 2100
  import_path: benchmarks.daydream.verifier:DaydreamVerifier
  kwargs:
    # The ChatGPT subscription login's tokens last about an hour, so the judge gets one with at
    # least 40 minutes left: the verifier's timeout plus five minutes' margin.
    min_judge_validity_sec: 2400
environment:
  type: docker
  delete: true
  override_cpus: 4
  override_memory_mb: 8192
  kwargs:
    auto_mounting: true
metrics:
  - type: uv-script
    kwargs:
      script_path: benchmarks/reviewbench/metric.py
