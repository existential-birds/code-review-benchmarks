# Shared native settings; supply exactly one dataset source in an overlay or -p.
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
agents:
  - import_path: benchmarks.daydream.agent:DaydreamAgent
    kwargs:
      capture_data: true
verifier:
  import_path: benchmarks.daydream.verifier:DaydreamVerifier
environment:
  type: docker
  delete: true
  kwargs:
    auto_mounting: true
metrics:
  - type: uv-script
    kwargs:
      script_path: benchmarks/aacr/metric.py
