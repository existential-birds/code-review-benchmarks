# Shared AACR settings; give the catalog with -p or a second -c.
jobs_dir: jobs
n_attempts: 1
n_concurrent_trials: 1
retry:
  max_retries: 0
agents:
  - import_path: benchmarks.daydream.agent:DaydreamAgent
    kwargs:
      capture_data: true
    # A Pi reviewer's provider key, read from where harbor run starts. Harbor sets it on the agent
    # phase's commands only and saves the job's configuration with ${OPENROUTER_API_KEY} in its
    # place, never the value. Unset, it is empty, which a Codex reviewer ignores.
    env:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
verifier:
  import_path: benchmarks.daydream.verifier:DaydreamVerifier
environment:
  type: docker
  delete: true
  kwargs:
    auto_mounting: true
metrics:
  - type: uv-script
    kwargs:
      script_path: benchmarks/aacr/metric.py
